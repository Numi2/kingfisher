name: Verify uninterrupted flight
on:
  push:
    branches: [uninterrupted-flight-v4-1]
    paths: ['.github/workflows/uninterrupted-flight.yml', 'scripts/apply-v4-1.py', 'scripts/verify-session.cjs', 'app/lib/FlightSession.mjs', 'app/components/PauseButton.jsx']
permissions:
  contents: write
concurrency:
  group: uninterrupted-flight-v4-1
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate flight session repair
        run: |
          python3 scripts/apply-v4-1.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/globals.css')
          p.write_text(p.read_text()+'\n/* Short landscape screens must not push the action controls below the viewport. */\n.game-shell { min-height: 0; height: 100dvh; }\n')
          p=Path('scripts/verify-session.cjs');s=p.read_text()
          anchor="   const simBefore=await p.evaluate(()=>window.__kingfisherEngine._simulationTime);"
          replacement=anchor+'''
             const targets=await p.locator('.action-controls .flight-control').evaluateAll(elements=>elements.map(el=>{
               const r=el.getBoundingClientRect();
               return {label:el.getAttribute('aria-label'),left:r.left,top:r.top,right:r.right,bottom:r.bottom,inViewport:r.left>=0&&r.top>=0&&r.right<=innerWidth&&r.bottom<=innerHeight};
             }));
             assert.ok(targets.every(t=>t.inViewport),'Offscreen action controls: '+JSON.stringify(targets));
             await p.screenshot({path:`test-artifacts/session-${profile.name}-controls.png`});'''
          assert s.count(anchor)==1;p.write_text(s.replace(anchor,replacement,1))
          PY
      - name: Verify motion and build
        run: |
          npm install --legacy-peer-deps
          npm run test:flight
          npm run build
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
      - name: Reproduce existing production pause triggers
        run: node scripts/verify-session.cjs --baseline
      - name: Verify improved desktop, portrait and landscape flight
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/flight-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-flight.cjs || { cat /tmp/flight-server.log; exit 1; }
          node scripts/verify-session.cjs || { cat /tmp/flight-server.log; exit 1; }
      - name: Save browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uninterrupted-flight-evidence
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit integrated verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-v4-1.py .github/workflows/uninterrupted-flight.yml .github/workflows/export-flight-source.yml
          git add app package.json README.md tests scripts .github/workflows/build.yml
          git commit -m 'Fix unintended pause menus; preserve continuous flight, safe backgrounding and precise controls'
          git push origin HEAD:uninterrupted-flight-v4-1
