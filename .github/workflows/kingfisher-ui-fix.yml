name: Apply Kingfisher lock feedback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kingfisher-ui-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct dive instructions and lock feedback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/components/KingfisherGame.jsx')
          text = path.read_text()
          text = text.replace(
              'const targetAction = hud.targetKind === "perch" ? "BANK THE CATCH" : hud.targetKind === "fish" ? "HOLD DIVE TO STRIKE" : "SEARCH THE RIVER";',
              'const targetAction = hud.targetKind === "perch" ? "BANK THE CATCH" : hud.targetKind === "fish" ? hud.targetLocked ? "LOCKED · COMMITTING" : settings.smartDive ? "TAP DIVE TO STRIKE" : "HOLD DIVE TO STRIKE" : "SEARCH THE RIVER";',
              1,
          )
          text = text.replace(
              '<div className={`target-marker ${marker.inside ? "inside" : "edge"} ${hud.targetKind}`} style={{ left: marker.left, top: marker.top }}>',
              '<div className={`target-marker ${marker.inside ? "inside" : "edge"} ${hud.targetKind} ${hud.targetLocked ? "locked" : ""}`} style={{ left: marker.left, top: marker.top }}>',
              1,
          )
          text = text.replace(
              '<p>Drag anywhere in the lower-left zone to steer. Hold Dive to lock onto the selected fish and accelerate downward. Hold Flap to burst forward, climb, or escape the water.</p>',
              '<p>Drag anywhere in the lower-left zone to steer. With Smart Dive on, tap Dive once to lock and commit to the selected fish. Press Flap at any time to break the dive, burst upward, or escape the water.</p>',
              1,
          )
          text = text.replace(
              '<span>FLY THROUGH A GOLD PERCH TO SWALLOW IT</span>',
              '<span>FLAP TO SURFACE · THEN FLY THROUGH A GOLD PERCH TO BANK IT</span>',
              1,
          )
          path.write_text(text)

          css = Path('app/globals.css')
          style = css.read_text()
          marker = '.target-marker.perch i { color: var(--gold); border-color: rgba(242,192,91,.7); }'
          addition = marker + '\n.target-marker.locked i { color: var(--gold); border-color: rgba(242,192,91,.95); background: rgba(66,45,8,.72); box-shadow: 0 0 22px rgba(242,192,91,.34); }\n.target-marker.locked span { color: #ffe6a3; border: 1px solid rgba(242,192,91,.42); }'
          if marker not in style:
              raise SystemExit('target marker css pattern not found')
          style = style.replace(marker, addition, 1)
          css.write_text(style)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/KingfisherGame.jsx app/globals.css
          git commit -m "Improve Kingfisher dive lock instructions and feedback"
          git push origin HEAD:main
