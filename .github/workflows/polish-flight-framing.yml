name: Verify flight framing polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/polish-flight-framing.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply screenshot-reviewed framing corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/lib/AgileKingfisherEngine.js'); s=p.read_text()
          old='    const distance = (wet ? 6.4 : 7.8) * clamp(finite(this.controlSettings.cameraDistance,1),0.78,1.32);'
          assert s.count(old)==1
          s=s.replace(old, '''    // Preserve room around the wings in narrow portrait viewports.
              const portraitFraming = clamp(0.70 / Math.max(0.3, this.camera.aspect), 1, 1.65);
              const distance = (wet ? 6.4 : 7.8) * portraitFraming * clamp(finite(this.controlSettings.cameraDistance,1),0.78,1.32);''',1)
          p.write_text(s)
          p=Path('app/globals.css')
          p.write_text(p.read_text()+'''\n@media (min-aspect-ratio: 1/1) { .flight-telemetry { bottom: max(20px,env(safe-area-inset-bottom)); } }\n''')
          p=Path('scripts/verify-flight.cjs'); s=p.read_text()
          old="      const buttons=await page.locator('.action-controls .flight-control').count();assert.equal(buttons,4);"
          new=old+'''
                const framing = await page.evaluate(() => {
                  const e=window.__kingfisherEngine;
                  e.bird.updateMatrixWorld(true); e.camera.updateMatrixWorld(true);
                  const center=e.bird.position.clone().project(e.camera);
                  const width=window.innerWidth,height=window.innerHeight;
                  const telemetry=document.querySelector('.flight-telemetry').getBoundingClientRect();
                  const centerX=(center.x*0.5+0.5)*width, centerY=(-center.y*0.5+0.5)*height;
                  const labelClear=!(centerX>=telemetry.left&&centerX<=telemetry.right&&centerY>=telemetry.top&&centerY<=telemetry.bottom);
                  const left=e.bird.position.clone().set(-2.6,0,0).applyMatrix4(e.bird.matrixWorld).project(e.camera).x;
                  const right=e.bird.position.clone().set(2.6,0,0).applyMatrix4(e.bird.matrixWorld).project(e.camera).x;
                  return {labelClear,left,right};
                });
                assert.ok(framing.labelClear,'telemetry overlaps bird center');
                assert.ok(Math.abs(framing.left)<0.95&&Math.abs(framing.right)<0.95,'wing span does not fit viewport');'''
          assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
      - name: Verify motion and production build
        run: |
          npm install --legacy-peer-deps
          npm run test:flight
          npm run build
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
      - name: Verify desktop and portrait controls and framing
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/flight-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-flight.cjs || { cat /tmp/flight-server.log; exit 1; }
      - name: Save verified screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-v4-final-framing
          path: test-artifacts
          if-no-files-found: ignore
      - name: Commit verified framing to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/polish-flight-framing.yml
          git add app/lib/AgileKingfisherEngine.js app/globals.css scripts/verify-flight.cjs
          git commit -m 'Keep wings in portrait view and clear flight telemetry from bird'
          git push origin HEAD:main
