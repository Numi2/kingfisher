name: Apply Kingfisher UX Max Overhaul

on:
  workflow_dispatch:
  push:
    branches:
      - ux-max-overhaul
    paths:
      - .github/workflows/ux-max-patch.yml
      - .github/scripts/ux_max_patch.py

permissions:
  contents: write

jobs:
  overhaul:
    runs-on: ubuntu-latest
    steps:
      - name: Check out overhaul branch
        uses: actions/checkout@v4
        with:
          ref: ux-max-overhaul
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply gameplay overhaul
        run: python3 .github/scripts/ux_max_patch.py

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify production build
        run: npm run build

      - name: Commit verified overhaul
        shell: bash
        run: |
          rm -f .github/workflows/ux-max-patch.yml .github/scripts/ux_max_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app package.json README.md .github
          git commit -m "Overhaul Kingfisher gameplay UX and cinematic feedback"
          git push origin HEAD:ux-max-overhaul
