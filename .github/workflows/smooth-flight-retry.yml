name: Verify Smooth Kingfisher Flight v3

on:
  push:
    branches: [smooth-flight-v3]
    paths:
      - ".github/workflows/smooth-flight-retry.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smooth-flight-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply controller rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/smooth-flight-v3.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('controller patch not found')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(block, 'smooth_flight_v3_patch.py', 'exec'))

          engine_path = Path('app/lib/KingfisherGameEngine.js')
          engine = engine_path.read_text()
          anchor = '    this.renderer?.dispose?.();'
          clear = '    if (makeFish.cache) makeFish.cache.clear();\n'
          if clear not in engine:
              if anchor not in engine:
                  raise SystemExit('dispose anchor not found')
              engine = engine.replace(anchor, clear + anchor, 1)
          engine_path.write_text(engine)
          PY

      - name: Build production app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install browser
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium

      - name: Test actual controls in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/kingfisher-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/kingfisher-server.log; exit 1; fi

          cat > /tmp/verify-kingfisher.cjs <<'TEST'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader',
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--disable-dev-shm-usage'
              ]
            });
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });

            await page.goto('http://127.0.0.1:3000/?debug=1', { waitUntil: 'networkidle' });
            await page.waitForSelector('canvas, .fatal-screen', { timeout: 15000 });
            const fatal = await page.$('.fatal-screen');
            if (fatal) throw new Error(`Renderer failed: ${await fatal.innerText()}`);
            assert.ok(await page.$('canvas'), 'WebGL canvas did not render');
            assert.equal(await page.evaluate(() => Boolean(
              document.createElement('canvas').getContext('webgl2') ||
              document.createElement('canvas').getContext('webgl')
            )), true, 'WebGL unavailable');

            await page.click('.hero-play');
            await page.waitForSelector('.state-playing', { timeout: 8000 });
            assert.equal(await page.evaluate(() => Boolean(window.__kingfisherEngine)), true, 'debug engine unavailable');

            const before = await page.evaluate(() => ({
              yaw: window.__kingfisherEngine.yaw,
              pitch: window.__kingfisherEngine.pitch
            }));
            const box = await page.locator('.joystick-zone').boundingBox();
            assert.ok(box, 'joystick unavailable');
            await page.mouse.move(box.x + box.width * 0.35, box.y + box.height * 0.55);
            await page.mouse.down();
            await page.mouse.move(box.x + box.width * 0.35 + 70, box.y + box.height * 0.55 - 18, { steps: 8 });
            await page.waitForTimeout(420);
            await page.mouse.up();
            await page.waitForTimeout(220);

            const after = await page.evaluate(() => {
              const e = window.__kingfisherEngine;
              return {
                yaw: e.yaw,
                pitch: e.pitch,
                yawVelocity: e.yawVelocity,
                pitchVelocity: e.pitchVelocity,
                speed: e.speed,
                camera: e.camera.position.toArray(),
                input: { ...e.filteredSteering }
              };
            });
            const yawChange = Math.abs(after.yaw - before.yaw);
            assert.ok(yawChange > 0.02, `joystick response too weak: ${yawChange}`);
            assert.ok(yawChange < 1.3, `joystick response snapped: ${yawChange}`);
            assert.ok([after.yaw, after.pitch, after.yawVelocity, after.pitchVelocity, after.speed, ...after.camera].every(Number.isFinite), 'non-finite flight state');
            assert.ok(Math.abs(after.input.x) < 0.15, `joystick did not settle: ${after.input.x}`);

            await page.click('.dive-control');
            await page.waitForTimeout(140);
            assert.equal(await page.evaluate(() => window.__kingfisherEngine.smartDiveCommit), true, 'first tap did not engage smart dive');
            await page.click('.dive-control');
            await page.waitForTimeout(140);
            assert.equal(await page.evaluate(() => window.__kingfisherEngine.smartDiveCommit), false, 'second tap did not cancel smart dive');

            assert.equal(await page.evaluate(() => {
              const e = window.__kingfisherEngine;
              return [e.yaw, e.pitch, e.yawVelocity, e.pitchVelocity, e.speed, ...e.camera.position.toArray()].every(Number.isFinite);
            }), true, 'dive destabilized flight state');
            assert.deepEqual(errors, [], `browser errors: ${errors.join(' | ')}`);
            await page.screenshot({ path: '/tmp/kingfisher-v3-browser.png' });
            await browser.close();
            console.log(JSON.stringify({ yawChange, state: after, smartDiveToggle: true }));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          TEST

          if ! node /tmp/verify-kingfisher.cjs; then
            echo '--- SERVER LOG ---'
            cat /tmp/kingfisher-server.log
            exit 1
          fi

      - name: Commit verified controller
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/smooth-flight-v3.yml .github/workflows/smooth-flight-run.yml .github/workflows/smooth-flight-retry.yml
          git add app/lib/KingfisherGameEngine.js app/components/KingfisherGame.jsx app/components/VirtualJoystick.jsx app/api/health/route.js package.json
          git commit -m "Replace clunky flight with smooth player-authoritative controller"
          git push origin HEAD:smooth-flight-v3
