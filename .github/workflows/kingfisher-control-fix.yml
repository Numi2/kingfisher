name: Apply Kingfisher control corrections

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kingfisher-control-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct steering and dive release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/KingfisherGameEngine.js')
          text = path.read_text()
          old = 'this.yaw -= input.x * yawRate * sensitivity * dt;'
          new = 'this.yaw += input.x * yawRate * sensitivity * dt;'
          if old not in text:
              raise SystemExit('steering pattern not found')
          text = text.replace(old, new, 1)
          old = '''  setFlapping(value) {\n    this.pointerFlap = Boolean(value);\n    if (value) this._cancelCommittedDive(false);\n  }'''
          new = '''  setFlapping(value) {\n    this.pointerFlap = Boolean(value);\n    if (value) this._cancelCommittedDive(true);\n  }'''
          if old not in text:
              raise SystemExit('flap pattern not found')
          text = text.replace(old, new, 1)
          old = 'if (input.flap && this.smartDiveCommit) this._cancelCommittedDive(false);'
          new = 'if (input.flap && this.smartDiveCommit) this._cancelCommittedDive(true);'
          if old not in text:
              raise SystemExit('flight flap pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/KingfisherGameEngine.js
          git commit -m "Correct Kingfisher steering direction and dive release"
          git push origin HEAD:main
