name: Verify agile flight v4
on:
  push:
    branches: [agility-controls-v4]
permissions:
  contents: write
concurrency:
  group: agility-controls-v4
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate controller and action UI
        run: |
          python3 scripts/integrate-agility.py
          python3 - <<'PY'
          from pathlib import Path
          def edit(file, old, new):
              p=Path(file); s=p.read_text()
              assert s.count(old)==1, (file,old,s.count(old))
              p.write_text(s.replace(old,new,1))
          edit('app/lib/FlightMotion.mjs', 'clamp(-1.13 + y * 0.98, -1.46, 0.3)', 'clamp(-1.13 + y * 2.25, -1.46, 1.18)')
          edit('app/lib/FlightMotion.mjs', 'const pitchWeight = assist *', 'const pitchWeight = (assist > 0 ? 0.75 + 0.25 * assist : 0) *')
          edit('app/lib/FlightMotion.mjs', '? 32 : 24;', '? 32 : 28;')
          edit('app/lib/AgileKingfisherEngine.js', 'wallDt > 0.25', 'wallDt > 2.0')
          edit('app/lib/AgileKingfisherEngine.js', 'const dt = Math.min(0.1,wallDt);', 'const dt = Math.min(0.25,wallDt);')
          edit('app/globals.css', 'font: 8px/1.2 inherit;', 'font-family: inherit; font-size: 8px; line-height: 1.2;')
          edit('scripts/verify-flight.cjs', 'browser.newContext({...profile,deviceScaleFactor:1})', 'browser.newContext({viewport:profile.viewport,isMobile:profile.isMobile,hasTouch:profile.hasTouch,deviceScaleFactor:1})')
          edit('scripts/verify-flight.cjs', "await page.locator('.brake-control').dispatchEvent('pointerdown',{pointerId:19,pointerType:'touch',button:0}).catch(()=>{});\n      await page.locator('.brake-control').dispatchEvent('pointercancel',{pointerId:19,pointerType:'touch'});", "await page.locator('.brake-control').evaluate(el=>el.addEventListener('pointerdown',event=>{window.__testPointerId=event.pointerId;},{once:true}));\n      const brakeBox=await page.locator('.brake-control').boundingBox();\n      await page.mouse.move(brakeBox.x+brakeBox.width/2,brakeBox.y+brakeBox.height/2);await page.mouse.down();\n      const pointerId=await page.evaluate(()=>window.__testPointerId);\n      await page.locator('.brake-control').dispatchEvent('pointercancel',{pointerId,pointerType:'mouse'});await page.mouse.up();\n      assert.equal(await page.evaluate(()=>window.__kingfisherEngine._actions.brake.size),0);")
          PY
      - name: Install and run motion regressions
        run: |
          npm install --legacy-peer-deps
          npm run test:flight
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
      - name: Verify desktop and touch gameplay
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/flight-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-flight.cjs || { cat /tmp/flight-server.log; exit 1; }
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-v4-browser-evidence
          path: test-artifacts
          if-no-files-found: ignore
      - name: Commit integrated and verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/integrate-agility.py .github/workflows/agility-v4.yml
          git add app package.json tests scripts/verify-flight.cjs
          git commit -m 'Integrate verified agile flight v4: actions, touch, catches and movement'
          git push origin HEAD:agility-controls-v4
