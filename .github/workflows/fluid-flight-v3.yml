name: Verify Fluid Flight v3

on:
  push:
    branches: [fluid-flight-v3]
    paths:
      - "scripts/fluid-flight-v3-trigger"

permissions:
  contents: write

jobs:
  fluid-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluid-flight-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fluid controller
        run: node scripts/apply-fluid-flight-v3.mjs

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Production build
        run: npm run build

      - name: Commit verified controller
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/KingfisherGameEngine.js
          git commit -m "Replace clunky flight with coordinated fluid controller"
          git push origin HEAD:fluid-flight-v3
